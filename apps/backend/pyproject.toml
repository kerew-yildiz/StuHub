[project]
name = "stuhub-backend"
version = "0.1.0"
description = "StuHub DS — yerel ders notu ve quiz uygulaması backend'i (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "lancedb>=0.37.1",
    "sentence-transformers>=5.7.0",
    "openai>=1.40",
    "markdown>=3.6",
    "yt-dlp>=2024.12.13",
    "faster-whisper>=1.1.0",
    "rapidocr-onnxruntime>=1.4.0",
    "python-docx>=1.1.2",
    "ddgs>=9.0.0",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.9",
    "ppt2pptx>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.370",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
# B008: FastAPI Depends() çağrıları default argümanlarda yaygın kullanımdır (Faz 1+).
extend-ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
pythonVersion = "3.12"
