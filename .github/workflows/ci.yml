# StuHub DS — CI/CD
# Her push/PR'de lint + tip + test + build + sır taraması; main'e giden her push,
# testler yeşilse GHCR'ye tek bir imaj olarak yayınlanır (Railway o imajı çeker —
# bkz. DEPLOY.md §2.1). PR'larda imaj yalnızca DERLENİR, push edilmez (Dockerfile'ın
# bozulmadığını erken yakalamak için).
# Ücretsiz tier (GitHub Actions); tüm adımlar ücretsiz açık kaynak araçlarla.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-scan:
    name: Sır taraması (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (ruff + pyright + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: uv kurulumu
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Tipler (pyright)
        run: uv run pyright
      - name: Testler (pytest)
        run: uv run pytest -v
      - name: Güvenlik (bandit)
        run: uv run bandit -q -r src
      - name: Güvenlik (pip-audit)
        run: uv run pip-audit

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Bağımlılıklar
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Tipler (tsc)
        run: npm run typecheck
      - name: Testler (vitest)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker imajı (derle, main'de GHCR'ye yayınla)
    runs-on: ubuntu-latest
    needs: [secrets-scan, backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest runner'ında yalnızca ~14 GB boş disk var; bu imajın build'i
      # (frontend + ML bağımlılıkları + gömülü model) yerelde 14.5 GB build cache
      # ölçtü ve runner iki kez diski doldurup ÇÖKTÜ (2026-09-09; job 3-6 dk sonra
      # ölüyor, logları bile yüklenemiyor). Kullanılmayan önyüklü SDK'lar ~25 GB
      # boşaltıyor — üçüncü parti action yerine düz `rm -rf` yeterli.
      - name: Runner diskinde yer aç
        run: |
          echo "önce:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          echo "sonra:"; df -h / | tail -1
      - name: Buildx kurulumu
        uses: docker/setup-buildx-action@v3
      - name: GHCR girişi (yalnızca push, main dalı)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiketler
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - name: Derle (+ main'de yayınla)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          # mode=max tüm ara katmanları cache'e yazar; GitHub cache kotası 10 GB,
          # bu build ondan büyük — sürekli tahliye + fazladan disk baskısı demek.
          cache-to: type=gha

